            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{display:none}

            (function(){
              var cv = document.getElementById('ssDots'), ctx = cv.getContext('2d'), dots = [], raf = 0;
              function seed(){ dots = []; var n = Math.round(cv.width * cv.height / 9000); for (var i = 0; i < n; i++) dots.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: (0.6 + Math.random() * 1.4) * (window.devicePixelRatio || 1), p: Math.random() * 6.283, s: 0.4 + Math.random() * 1.2 }); }
              function size(){ var d = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d); seed(); }
              function draw(t){
                if (!document.body.contains(cv) || cv.closest('.hidden')) { cancelAnimationFrame(raf); return; }
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#fff';
                for (var i = 0; i < dots.length; i++) { var o = dots[i], a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t / 1000 * o.s + o.p)); ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.283); ctx.fill(); }
                ctx.globalAlpha = 1; raf = requestAnimationFrame(draw);

              size(); addEventListener('resize', size); raf = requestAnimationFrame(draw);
            })();
            </script>
